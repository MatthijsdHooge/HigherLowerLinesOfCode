<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codebases: Higher or Lower</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdfde3;--ink:#1d211f;--mute:#6d6f5f;--line:#d6d6ae;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14160f;--ink:#f1f1dc;--mute:#a3a58f;--line:#2e3123}}
:root[data-theme="dark"]{--bg:#14160f;--ink:#f1f1dc;--mute:#a3a58f;--line:#2e3123}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding:12px 18px;border-bottom:1px solid var(--line)}
header b{font:700 1.5rem Fraunces,Georgia,serif;letter-spacing:-.02em}
header span{color:var(--mute);font-weight:300}
.sc{margin-left:auto;font-weight:500}
.sc i{font-style:normal;font-weight:700}
main{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;position:relative}
@media(min-width:760px){main{grid-template-rows:none;grid-template-columns:1fr 1fr}}
.card{padding:clamp(16px,4vw,40px);display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:hidden;position:relative;transition:background .3s}
.card h2{font:700 clamp(1.6rem,5vw,2.8rem)/1.05 Fraunces,Georgia,serif;margin:0;letter-spacing:-.02em}
.sub{margin:0;opacity:.75;font-weight:300}
.val{font:700 clamp(1.6rem,5vw,2.6rem) Outfit,sans-serif;margin-top:10px}
.val small{display:block;font-size:.9rem;font-weight:300;opacity:.8}
.q{margin:12px 0 4px;font-weight:300}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{font:700 1.1rem Outfit,sans-serif;padding:12px 26px;border-radius:999px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer}
button:hover{background:rgba(255,255,255,.28)}
.bar{height:10px;border-radius:5px;background:rgba(0,0,0,.14);margin-top:10px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:currentColor;opacity:.75;transition:width .9s ease}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;font:700 1rem Fraunces,serif;z-index:2;border:2px solid var(--line)}
.verdict{position:absolute;right:18px;top:14px;font:700 1.1rem Outfit}
.ov{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.ov[hidden]{display:none}
.ov h1{font:700 clamp(2rem,7vw,3.4rem) Fraunces,serif;margin:0}
.ov p{margin:0;color:var(--mute)}
.ov button{color:var(--ink);margin-top:12px}
footer{padding:8px 18px;font-size:.75rem;color:var(--mute);border-top:1px solid var(--line)}
</style>
</head>
<body>
<header><b>Codebases</b><span>Higher or lower: lines of code</span><div class="sc">Score <i id="s">0</i> · Best <i id="b">0</i></div></header>
<main>
<section class="card" id="L"></section>
<div class="vs">vs</div>
<section class="card" id="R"></section>
<div class="ov" id="ov" hidden><h1 id="ot"></h1><p id="op"></p><button id="again">Play again</button></div>
</main>
<footer>Data: “Codebases” by David McCandless / Information is Beautiful (2015). Some figures are estimates. Added items: open-source line counts from E. Klausmeier (Jan 2024), Apollo figure from Computerworld.</footer>
<script>
// [name, note, millions of lines, category]
var D=[
["Simple iPhone game app","",0.01,"g"],["Unix v1.0","1971",0.01,"o"],["Win32/Simile virus","",0.01,"a"],
["Average iPhone app","",0.04,"a"],["Pacemaker","",0.08,"m"],["Photoshop v1.0","1990",0.1,"a"],
["Camino","web browser",0.2,"b"],["Quake 3 engine","3D video game system",0.4,"g"],["Space Shuttle","",0.4,"m"],
["A million lines of code","18,000 pages of printed text",1,"r"],["CryEngine 2","3D video game system",1,"g"],
["Bacteria","Syphilis (Treponema pallidum)",1.1,"x"],["Age of Empires Online","",1.2,"g"],
["CESM Climate Model","National Center for Atmospheric Research",1.2,"a"],["F-22 Raptor fighter jet","",1.7,"m"],
["Linux Kernel 2.2.0","core code",2,"o"],["Jurassic Park codebase","source: Dennis Nedry",2,"o"],
["Hubble Space Telescope","",2,"m"],["Unreal Engine 3","3D video game system",2,"g"],["Windows 3.1","1992",2.5,"o"],
["Large Hadron Collider","root software",3.5,"m"],["US military drone","control software only",3.5,"m"],
["Photoshop CS6","image editing software",4.5,"a"],["Windows NT 3.1","1993",4.5,"o"],
["HD DVD Player on Xbox","just the player",4.7,"a"],["Fixing HealthCare.gov","apparently",5,"w"],
["Mars Curiosity Rover","Martian ground vehicle probe",5,"m"],["Linux kernel 2.6.0","2003",5.2,"o"],
["World of Warcraft","server only",5.5,"g"],["Boeing 787","avionics & online support systems only",6.5,"m"],
["Google Chrome (2015)","2015 upper estimate",6.7,"b"],["Windows NT 3.5","1993",7.5,"o"],["Firefox","latest version",9.7,"b"],
["Chevy Volt","electric car",10,"m"],["Intuit QuickBooks","accounting software",10,"a"],["Windows NT 4.0","1996",11,"o"],
["Android","mobile device operating system",12,"o"],["Mozilla Core","core code of all Mozilla software",12,"b"],
["MySQL","database language",12,"w"],["Boeing 787 (total)","total flight software",14,"m"],
["Linux 3.1","recent version",15,"o"],["Apache Open Office","open-source office software",23,"a"],
["F-35 Fighter jet","2013",24,"m"],["Microsoft Office 2001","",25,"a"],["Windows 2000","",29,"o"],
["Microsoft Office for Mac","2006",30,"a"],["Symbian","mobile operating system",37,"o"],["Windows 7","2009",40,"o"],
["Windows XP","2001",40,"o"],["Microsoft Office 2013","",45,"a"],["Large Hadron Collider (total)","total code",50,"m"],
["Windows Vista","2007",50,"o"],["Microsoft Visual Studio 2012","",50,"a"],["Facebook","including backend code",62,"w"],
["US Army Future Combat System","fast battlefield network system (aborted)",63,"o"],
["Debian 5.0","free, open-source operating system",68,"o"],["Mac OS X “Tiger”","v10.4",86,"o"],
["Mouse","total DNA basepairs in genome",120,"x"],
["Simplified Saaze","static site generator, 2024",0.002,"w"],
["Zola","static site generator, 2024",0.022,"w"],
["Apollo guidance software","Apollo spaceflights",0.145,"m"],
["Linux kernel 1.0","first release",0.176,"o"],
["bash","shell, 2024",0.249,"t"],
["X server","2024",0.511,"t"],
["Git","version control, 2024",0.58,"t"],
["Slurm","HPC workload manager, 2024",0.844,"t"],
["WordPress","2024",1.157,"w"],
["Apache HTTP Server","2024",1.659,"w"],
["PHP","2024",1.814,"w"],
["GCC","compiler collection, 2024",15.768,"t"],
["LLVM","compiler infrastructure, 2024",18.914,"t"],
["Chrome (2024)","2024 count",30.992,"b"],
["Linux kernel (2024)","2024 count",34.987,"o"],
["Ford F-150","pickup truck",150,"m"],
["Google","all internet services",2000,"w"]];
// category -> [label, background, text colour]
var C={g:["Game","#e6a92f","#1d211f"],o:["Operating system","#b7e4de","#1d211f"],a:["App","#d4506f","#fff"],
m:["Machine","#3e4543","#f3f3e6"],b:["Browser","#6bb09c","#10201b"],x:["Organism","#9b86c2","#1b1230"],
w:["Web","#b7e07a","#1d211f"],t:["Developer tool","#e8855a","#1d211f"],r:["Reference","#aeaeae","#1d211f"]};
var $=function(i){return document.getElementById(i)};
var cur,chal,score=0,best=0,recent=[],locked=false;
try{best=+localStorage.getItem("codebases-best")||0}catch(e){}
function fmt(v){return Math.round(v*1e6).toLocaleString("en-US")}
function barW(v){return Math.max(2,Math.log(v/0.001)/Math.log(2000/0.001)*100)}
function pick(){
  var pool=D.filter(function(d){return d[2]!==cur[2]&&recent.indexOf(d[0])<0});
  chal=pool[Math.floor(Math.random()*pool.length)];
  recent.push(chal[0]);if(recent.length>10)recent.shift();
}
function card(el,d,body){
  var c=C[d[3]];el.style.background=c[1];el.style.color=c[2];
  el.innerHTML='<p class="sub">'+c[0]+'</p><h2>'+d[0]+'</h2><p class="sub">'+d[1]+'</p>'+body;
}
function known(d){return '<div class="val">'+fmt(d[2])+'<small>lines of code</small></div><div class="bar"><i style="width:'+barW(d[2])+'%"></i></div>'}
function render(){
  card($("L"),cur,known(cur));
  card($("R"),chal,'<p class="q">Does it have more or fewer lines of code than '+cur[0]+'?</p><div class="btns"><button data-g="h">Higher ▲</button><button data-g="l">Lower ▼</button></div>');
  $("s").textContent=score;$("b").textContent=best;locked=false;
}
function guess(g){
  if(locked)return;locked=true;
  var ok=(g==="h")===(chal[2]>cur[2]);
  var R=$("R");
  R.innerHTML='<span class="verdict">'+(ok?"✓ Correct":"✗ Wrong")+'</span><p class="sub">'+C[chal[3]][0]+'</p><h2>'+chal[0]+'</h2><p class="sub">'+chal[1]+'</p><div class="val"><span id="n">0</span><small>lines of code</small></div><div class="bar"><i id="bi"></i></div>';
  setTimeout(function(){$("bi").style.width=barW(chal[2])+"%"},30);
  var t0=performance.now(),target=Math.round(chal[2]*1e6);
  (function step(t){var p=Math.min(1,(t-t0)/800),e=1-Math.pow(1-p,3);
    $("n").textContent=Math.round(target*e).toLocaleString("en-US");
    if(p<1)requestAnimationFrame(step)})(t0);
  setTimeout(function(){
    if(ok){score++;if(score>best){best=score;try{localStorage.setItem("codebases-best",best)}catch(e){}}
      cur=chal;pick();render()}
    else{$("ot").textContent="Game over";
      $("op").textContent=chal[0]+" has "+fmt(chal[2])+" lines vs "+fmt(cur[2])+" for "+cur[0]+". Score: "+score+" · Best: "+best;
      $("ov").hidden=false}
  },1900);
}
function start(){score=0;recent=[];cur=D[Math.floor(Math.random()*D.length)];recent.push(cur[0]);pick();$("ov").hidden=true;render()}
document.addEventListener("click",function(e){var g=e.target.getAttribute&&e.target.getAttribute("data-g");if(g)guess(g)});
$("again").onclick=start;
start();
</script>
</body>
</html>
